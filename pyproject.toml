[project]
name = "f1superclip-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Whitney Holt", email = "a02411667@aggies.usu.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "arviz>=1.3.0",
    "bambi>=0.21.0",
    "fastf1>=3.8",
    "numpy>=2.5.4",
    "polars>=2.0.0",
